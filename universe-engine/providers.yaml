# Scoped GCP provider family: cloudplatform (projects/IAM), KMS, Cloud SQL,
# compute (PSC). Pinned to v3.0.1, all five packages release together.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-gcp
spec:
  package: xpkg.upbound.io/upbound/provider-family-gcp:v3.0.1
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-cloudplatform
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-cloudplatform:v3.0.1
  runtimeConfigRef:
    name: gcp-provider-runtime
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-kms
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-kms:v3.0.1
  runtimeConfigRef:
    name: gcp-provider-runtime
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-sql
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-sql:v3.0.1
  runtimeConfigRef:
    name: gcp-provider-runtime
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-compute
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-compute:v3.0.1
  runtimeConfigRef:
    name: gcp-provider-runtime
---
# In-cluster provider: Namespace, NetworkPolicy, ResourceQuota, Redis
# Deployment, API-key Secret. Own ProviderConfig, separate from GCP above.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v1.3.0
  runtimeConfigRef:
    name: gcp-provider-runtime
