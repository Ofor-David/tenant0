# One ProviderConfig, shared by every provider in providers.yaml (the family
# meta-package registers this shared type, each specific provider reuses it).
# InjectedIdentity means "use the pod's Workload-Identity-bound GCP service
# account", not a downloaded key file.
apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  projectID: t0-host-network
  credentials:
    source: InjectedIdentity
