# Merge-blocking gate: any PR touching the spine or its policies must produce
# a clean `tofu plan` that also passes every policy in policy/ (conftest).
# A failing policy here means the PR cannot merge, not a warning, a block.
name: hyperverse plan + policy gate

on:
  pull_request:
    paths:
      - "hyperverse/**"
      - "policy/**"

jobs:
  plan-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: hyperverse
    env:
      TF_VAR_billing_account_id: ${{ secrets.TF_VAR_BILLING_ACCOUNT_ID }}
      TF_VAR_org_id: ${{ secrets.TF_VAR_ORG_ID }}
      TF_VAR_region: ${{ vars.TF_VAR_REGION }}
      TF_VAR_crossplane_node_machine_type: ${{ vars.TF_VAR_CROSSPLANE_NODE_MACHINE_TYPE }}
      TF_VAR_crossplane_node_count: ${{ vars.TF_VAR_CROSSPLANE_NODE_COUNT }}
      TF_VAR_workloads_node_machine_type: ${{ vars.TF_VAR_WORKLOADS_NODE_MACHINE_TYPE }}
      TF_VAR_workloads_min_node_count: ${{ vars.TF_VAR_WORKLOADS_MIN_NODE_COUNT }}
      TF_VAR_workloads_max_node_count: ${{ vars.TF_VAR_WORKLOADS_MAX_NODE_COUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/894310531756/locations/global/workloadIdentityPools/github-actions/providers/github"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"

      - name: tofu init
        run: tofu init

      - name: tofu plan
        run: tofu plan -out=tfplan.binary

      - name: tofu show (JSON)
        run: tofu show -json tfplan.binary > tfplan.json

      - uses: instrumenta/conftest-action@master
        with:
          files: hyperverse/tfplan.json
          policy: policy
