# Tenant stamp-out recipe. Pipeline mode, one
# function-patch-and-transform step standing in for v1's bare resources list.
#
# sizeTier tiers: small=db-custom-1-3840/256Mi redis/quota 2cpu-2Gi,
# medium=db-custom-2-7680/512Mi/4cpu-4Gi, large=db-custom-4-15360/1Gi/8cpu-8Gi.
# Only small is exercised by tenant-a/tenant-b.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenants.universe.tenant0.io
spec:
  compositeTypeRef:
    apiVersion: universe.tenant0.io/v1alpha1
    kind: Tenant
  mode: Pipeline
  pipeline:
    - step: compose-tenant-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: project
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta1
              kind: Project
              spec:
                forProvider:
                  folderId: "${TENANT0_FOLDER_ID}"
                  billingAccount: "${TENANT0_BILLING_ACCOUNT_ID}"
                  deletionPolicy: DELETE
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.projectId
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.projectId
                toFieldPath: status.projectId
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.number
                toFieldPath: status.projectNumber

          # Enable Network Connectivity API on the tenant project so it can
          # participate in cross-project PSC service-connection automation
          # (the producer side of the Cloud SQL PSC endpoint).
          - name: api-networkconnectivity
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta1
              kind: ProjectService
              spec:
                forProvider:
                  service: networkconnectivity.googleapis.com
                  disableOnDestroy: false
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-networkconnectivity"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # Explicitly enable Cloud SQL Admin API on the tenant project rather
          # than relying on side-effect auto-enablement at first instance create.
          - name: api-sqladmin
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta1
              kind: ProjectService
              spec:
                forProvider:
                  service: sqladmin.googleapis.com
                  disableOnDestroy: false
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-sqladmin"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # Cloud Logging, needed to read Cloud SQL admin audit logs on the tenant project.
          - name: api-logging
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta1
              kind: ProjectService
              spec:
                forProvider:
                  service: logging.googleapis.com
                  disableOnDestroy: false
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-logging"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # Secret Manager, backs the real per-tenant API key (see ESO
          # resources below: SecretStore/Password/ExternalSecret/PushSecret).
          - name: api-secretmanager
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta1
              kind: ProjectService
              spec:
                forProvider:
                  service: secretmanager.googleapis.com
                  disableOnDestroy: false
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-secretmanager"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # Service Usage API, needed by sqladmin-service-identity's direct
          # call to serviceusage.googleapis.com's generateServiceIdentity
          # endpoint (force-provisions Cloud SQL's P4SA, see that Job's own
          # comment). Confirmed live this wasn't already implicitly enabled
          # by any of the other ProjectServices - the call 403'd with
          # SERVICE_DISABLED until this was added explicitly.
          - name: api-serviceusage
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta1
              kind: ProjectService
              spec:
                forProvider:
                  service: serviceusage.googleapis.com
                  disableOnDestroy: false
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-serviceusage"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # Tenant SA, least-privilege (Cloud SQL client only for now).
          - name: tenant-sa
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta1
              kind: ServiceAccount
              spec:
                forProvider:
                  displayName: Tenant workload identity
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-sa"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          - name: tenant-sa-iam
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ProjectIAMMember
              spec:
                forProvider:
                  role: roles/cloudsql.client
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-sa-cloudsql-client"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                  strategy: string
                  string: {fmt: "serviceAccount:t0-u-%s-sa@t0-u-%s.iam.gserviceaccount.com"}
                toFieldPath: spec.forProvider.member

          # Lets the pgvector migration Job (below) look up the instance's
          # live PSC IP via the Cloud SQL Admin API at run time (instead of
          # depending on a Crossplane-patched IP that may not exist yet), and
          # create its own IAM database user (with cloudsqlsuperuser)
          # directly via that same API (the Crossplane User resource panics
          # this provider on create for CLOUD_IAM_SERVICE_ACCOUNT users).
          - name: tenant-sa-cloudsql-admin
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ProjectIAMMember
              spec:
                forProvider:
                  role: roles/cloudsql.admin
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-sa-cloudsql-admin"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                  strategy: string
                  string: {fmt: "serviceAccount:t0-u-%s-sa@t0-u-%s.iam.gserviceaccount.com"}
                toFieldPath: spec.forProvider.member

          # Lets ESO's PushSecret (below) write the tenant's API key into
          # Secret Manager, authenticated via the tenant SA's existing WI
          # binding (no new identity needed).
          - name: tenant-sa-secretmanager-admin
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ProjectIAMMember
              spec:
                forProvider:
                  role: roles/secretmanager.admin
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-sa-secretmanager-admin"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                  strategy: string
                  string: {fmt: "serviceAccount:t0-u-%s-sa@t0-u-%s.iam.gserviceaccount.com"}
                toFieldPath: spec.forProvider.member

          # Lets the sqladmin-service-identity Job (below) force-provision
          # Cloud SQL's per-project service agent via the Service Usage API,
          # instead of waiting on Crossplane's reconcile backoff to outlast
          # the race against kms-key-cloudsql-iam (see that resource's own
          # comment for the race itself).
          - name: tenant-sa-serviceusage-admin
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ProjectIAMMember
              spec:
                forProvider:
                  role: roles/serviceusage.serviceUsageAdmin
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-sa-serviceusage-admin"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                  strategy: string
                  string: {fmt: "serviceAccount:t0-u-%s-sa@t0-u-%s.iam.gserviceaccount.com"}
                toFieldPath: spec.forProvider.member

          # Operator read access to the tenant project, so humans can see and
          # inspect tenant resources (projects Crossplane creates are otherwise
          # invisible to any identity not granted a role on them).
          - name: operator-viewer
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ProjectIAMMember
              spec:
                forProvider:
                  role: roles/viewer
                  member: "${TENANT0_OPERATOR_MEMBER}"
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-operator-viewer"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # Operator Cloud SQL admin on the tenant project, so humans can
          # inspect DB operation logs and manage instances directly.
          - name: operator-cloudsql-admin
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ProjectIAMMember
              spec:
                forProvider:
                  role: roles/cloudsql.admin
                  member: "${TENANT0_OPERATOR_MEMBER}"
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-operator-cloudsql-admin"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # Operator read access to the real Secret Manager payload, same
          # reason as operator-viewer/operator-cloudsql-admin above: projects
          # Crossplane creates are invisible to any identity not explicitly
          # granted a role on them, and secretAccessor is separate from the
          # broader roles/viewer (which only sees secret metadata, not values).
          - name: operator-secretmanager-accessor
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ProjectIAMMember
              spec:
                forProvider:
                  role: roles/secretmanager.secretAccessor
                  member: "${TENANT0_OPERATOR_MEMBER}"
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-operator-secretmanager-accessor"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # KMS key in tenant0-keyring, CMEK source for Cloud SQL.
          - name: kms-key
            base:
              apiVersion: kms.gcp.upbound.io/v1beta2
              kind: CryptoKey
              spec:
                forProvider:
                  keyRing: projects/t0-security/locations/us-central1/keyRings/tenant0-keyring
                  purpose: ENCRYPT_DECRYPT
                  rotationPeriod: 7776000s # 90 days
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-key"}

          # Grant the tenant's per-project Cloud SQL service agent permission to use
          # the CMEK key, which lives in t0-security, not the tenant project.
          #
          # Race, worked around by sqladmin-service-identity below: this
          # service agent doesn't exist on a brand-new project until Cloud
          # SQL's own first-use flow lazily creates it, normally triggered
          # by the cloudsql DatabaseInstance resource's own create call. If
          # this grant's reconcile lands first, it 400s with "Service
          # account ... does not exist" and depends entirely on Crossplane's
          # retry backoff outlasting the race - observed NOT resolving
          # within 15+ minutes on one tenant despite resolving in under a
          # minute on others. sqladmin-service-identity force-provisions the
          # same service agent explicitly instead of waiting on it as a side
          # effect.
          - name: kms-key-cloudsql-iam
            base:
              apiVersion: kms.gcp.upbound.io/v1beta2
              kind: CryptoKeyIAMMember
              spec:
                forProvider:
                  role: roles/cloudkms.cryptoKeyEncrypterDecrypter
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-key-cloudsql-iam"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.cryptoKeyId
                transforms:
                  - type: string
                    string: {type: Format, fmt: "projects/t0-security/locations/us-central1/keyRings/tenant0-keyring/cryptoKeys/t0-u-%s-key"}
              - type: FromCompositeFieldPath
                fromFieldPath: status.projectNumber
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string: {type: Format, fmt: "serviceAccount:service-%s@gcp-sa-cloud-sql.iam.gserviceaccount.com"}

          # Cloud SQL: PSC enabled, IAM DB auth, CMEK, PITR, sized by tier.
          - name: cloudsql
            base:
              apiVersion: sql.gcp.upbound.io/v1beta2
              kind: DatabaseInstance
              spec:
                forProvider:
                  region: us-central1
                  databaseVersion: POSTGRES_18
                  deletionProtection: false
                  settings:
                    edition: ENTERPRISE
                    ipConfiguration:
                      ipv4Enabled: false
                      pscConfig:
                        - pscEnabled: true
                          allowedConsumerProjects: ["${TENANT0_HOST_NETWORK_PROJECT_NUMBER}"]
                          pscAutoConnections:
                            - consumerNetwork: projects/t0-host-network/global/networks/t0-hyperverse-vpc
                              consumerServiceProjectId: t0-host-network
                    databaseFlags:
                      - name: cloudsql.iam_authentication
                        value: "on"
                    backupConfiguration:
                      enabled: true
                      pointInTimeRecoveryEnabled: true
                      transactionLogRetentionDays: 7
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-db"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.project
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sizeTier
                toFieldPath: spec.forProvider.settings.tier
                transforms:
                  - type: match
                    match:
                      patterns:
                        - type: literal
                          literal: small
                          result: db-custom-1-3840
                        - type: literal
                          literal: medium
                          result: db-custom-2-7680
                        - type: literal
                          literal: large
                          result: db-custom-4-15360
                      fallbackTo: Value
                      fallbackValue: db-custom-1-3840
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.encryptionKeyName
                transforms:
                  - type: string
                    string: {type: Format, fmt: "projects/t0-security/locations/us-central1/keyRings/tenant0-keyring/cryptoKeys/t0-u-%s-key"}
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.connectionName
                toFieldPath: status.cloudSqlConnectionName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.settings.ipConfiguration.pscConfig[0].pscAutoConnections[0].ipAddress
                toFieldPath: status.cloudSqlPscIpAddress

          - name: namespace
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Namespace
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-namespace"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}

          # Egress to the GKE metadata server (169.254.169.254, a node-local
          # address, not a pod) is required by every Workload-Identity-using
          # workload in this namespace (pgvector-migration,
          # sqladmin-service-identity below) - kubelet's own WI proxy
          # intercepts calls to it and injects the pod's federated token.
          # This was silently masked the entire time NetworkPolicy
          # enforcement didn't actually work on this cluster (see
          # kms-key-cloudsql-iam's comment on Dataplane V2); once
          # enforcement started working for real, this default-deny policy
          # broke WI for every pod here until this rule was added -
          # confirmed live (curl to the metadata server timed out from
          # inside a WI-restricted namespace, succeeded instantly from an
          # unrestricted one).
          - name: network-policy
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      name: default-deny
                    spec:
                      podSelector: {}
                      policyTypes: [Ingress, Egress]
                      ingress:
                        - from: [{podSelector: {}}]
                      egress:
                        - to: [{podSelector: {}}]
                        - to: [] # allow DNS
                          ports:
                            - {protocol: UDP, port: 53}
                            - {protocol: TCP, port: 53}
                        - to:
                            - ipBlock: {cidr: 169.254.169.254/32}
                          ports:
                            - {protocol: TCP, port: 80}
                        # Google API access (sqladmin/serviceusage, called
                        # directly by pgvector-migration and
                        # sqladmin-service-identity). Tried scoping this to
                        # the fixed private.googleapis.com range
                        # (199.36.153.8/30) first, on the assumption that
                        # this subnet's Private Google Access setting routes
                        # *.googleapis.com there - confirmed live via
                        # `kubectl exec ... nslookup serviceusage.googleapis.com`
                        # that it does NOT: without a private DNS zone
                        # override for googleapis.com, it resolves to normal
                        # broad public Google IP ranges (172.217.x.x etc,
                        # not one small block), and GKE's standard Dataplane
                        # V2 doesn't expose Cilium's FQDN-based
                        # CiliumNetworkPolicy CRD (GKE Enterprise only,
                        # confirmed via `kubectl get crd | grep cilium` -
                        # only internal-use CRDs present, no
                        # ciliumnetworkpolicies.cilium.io). Deliberate
                        # tradeoff: allow all egress on 443 rather than
                        # enumerate Google's published IP ranges (large,
                        # changes over time) or take on a GKE Enterprise
                        # upgrade. The actual isolation goal - no direct
                        # pod-to-pod cross-tenant traffic, no non-HTTP(S)
                        # egress - stays fully enforced by the ingress rule
                        # and this policy's own default-deny baseline. Port
                        # 80 alongside it for the same reason: confirmed
                        # live that pgvector-migration's `apt-get install
                        # curl jq` step needs plain-HTTP access to Debian's
                        # package mirrors (deb.debian.org,
                        # apt.postgresql.org), which the metadata-server-only
                        # port 80 rule above doesn't cover.
                        - to: []
                          ports:
                            - {protocol: TCP, port: 443}
                            - {protocol: TCP, port: 80}
                        # Cloud SQL PSC endpoint. Each tenant's PSC IP is
                        # dynamically assigned within this dedicated subnet
                        # (t0-hyperverse-psc-us-central1, confirmed via
                        # `gcloud compute networks subnets list`), not a
                        # fixed per-tenant address, so the whole subnet is
                        # allowed rather than one IP. Needed by
                        # pgvector-migration's psql connection.
                        - to:
                            - ipBlock: {cidr: 10.40.0.0/24}
                          ports:
                            - {protocol: TCP, port: 5432}
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-default-deny"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}

          - name: resource-quota
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ResourceQuota
                    metadata:
                      name: tenant-quota
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-quota"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sizeTier
                toFieldPath: spec.forProvider.manifest.spec.hard.cpu
                transforms:
                  - type: match
                    match:
                      patterns:
                        - {type: literal, literal: small, result: "2"}
                        - {type: literal, literal: medium, result: "4"}
                        - {type: literal, literal: large, result: "8"}
                      fallbackTo: Value
                      fallbackValue: "2"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sizeTier
                toFieldPath: spec.forProvider.manifest.spec.hard.memory
                transforms:
                  - type: match
                    match:
                      patterns:
                        - {type: literal, literal: small, result: 2Gi}
                        - {type: literal, literal: medium, result: 4Gi}
                        - {type: literal, literal: large, result: 8Gi}
                      fallbackTo: Value
                      fallbackValue: 2Gi

          # Workload Identity: namespace-scoped KSA <-> tenant GCP SA.
          - name: tenant-ksa
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                      name: u-workload
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-ksa"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                  strategy: string
                  string: {fmt: "t0-u-%s-sa@t0-u-%s.iam.gserviceaccount.com"}
                toFieldPath: spec.forProvider.manifest.metadata.annotations[iam.gke.io/gcp-service-account]

          - name: tenant-wi-binding
            base:
              apiVersion: cloudplatform.gcp.upbound.io/v1beta2
              kind: ServiceAccountIAMMember
              spec:
                forProvider:
                  role: roles/iam.workloadIdentityUser
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-wi-binding"}
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                  strategy: string
                  string: {fmt: "projects/t0-u-%s/serviceAccounts/t0-u-%s-sa@t0-u-%s.iam.gserviceaccount.com"}
                toFieldPath: spec.forProvider.serviceAccountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string: {type: Format, fmt: "serviceAccount:t0-host-network.svc.id.goog[u-%s/u-workload]"}

          # One-shot Job that force-provisions Cloud SQL's per-project
          # service agent via the Service Usage API's generateServiceIdentity
          # call (the same call gcloud beta services identity create wraps),
          # instead of waiting for Cloud SQL's own instance-create flow to
          # trigger it as a side effect - see kms-key-cloudsql-iam's comment
          # above for the race this closes. Idempotent: calling this on an
          # already-provisioned service agent just returns the existing one.
          - name: sqladmin-service-identity
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                      name: sqladmin-service-identity
                    spec:
                      backoffLimit: 6
                      template:
                        spec:
                          restartPolicy: Never
                          serviceAccountName: u-workload
                          containers:
                            - name: sqladmin-service-identity
                              image: curlimages/curl:8.11.0
                              resources:
                                requests: {cpu: 50m, memory: 32Mi}
                              command: ["/bin/sh", "-c"]
                              args:
                                - |
                                  set -e
                                  TOKEN=$(curl -sf -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                                  curl -sf -X POST -H "Authorization: Bearer $TOKEN" "https://serviceusage.googleapis.com/v1beta1/projects/$GCP_PROJECT/services/sqladmin.googleapis.com:generateServiceIdentity"
                              env:
                                - {name: GCP_PROJECT, value: PLACEHOLDER}
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-sqladmin-service-identity"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].value
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          # One-shot Job that enables pgvector on the tenant's Cloud SQL
          # instance. Runs as the tenant KSA (Workload Identity -> tenant
          # GSA), fetches its own IAM token from the metadata server, looks
          # up the instance's current PSC IP via the Cloud SQL Admin API
          # (rather than trusting a Crossplane-patched IP that may not exist
          # yet at render time), creates/grants its own IAM database user via
          # that same API (the Crossplane User resource panics this provider
          # on create for CLOUD_IAM_SERVICE_ACCOUNT users, worked around
          # entirely here), then runs CREATE EXTENSION over psql using that
          # IAM token as the password.
          #
          # In-script retry loop, not just Job-level backoffLimit: the
          # instance reaching GCP API state RUNNABLE doesn't guarantee its
          # PSC endpoint/IAM-auth path is immediately connectable - a real
          # tenant hit exactly this, exhausting all 6 Job-level backoff
          # attempts within the race window. Job-level retries recreate the
          # whole pod (re-running apk/apt install every time, wasting most
          # of each retry's time on package installation instead of
          # actually waiting on the DB), so the fix is a bounded loop
          # INSIDE the script around the real "is it ready" signal (the
          # full describe -> create-user -> psql sequence), backed by
          # backoffLimit only as an outer safety net that should now rarely
          # if ever be needed. Switched off postgres:18 (Debian, apt-get)
          # to postgres:18-alpine (apk) specifically to make package
          # install fast enough that it's not worth avoiding per-attempt.
          #
          # Real bug caught on the first version of this loop (confirmed
          # live on a real tenant, not assumed): CREATE USER is
          # idempotent, so re-issuing it every attempt is safe, but doing
          # so appears to reset a short IAM-auth-propagation window before
          # psql against that user will actually authenticate - every
          # attempt hit the exact same just-created-user unpropagated
          # state and failed the same way, looping the full 10 attempts
          # without ever letting propagation catch up (manually testing
          # each step in isolation afterward "worked instantly" only
          # because enough real time had passed since the Job's LAST
          # create-user call). Fixed with an explicit `sleep 5` between
          # create-user and psql within each attempt, restoring the
          # buffer the original flat sleep 10 provided, while keeping the
          # bounded-retry structure for the separate "instance not
          # RUNNABLE/connectable yet" race this loop also covers.
          #
          # Caveat (confirmed by deleting the real Cloud SQL instance and
          # watching the reconcile): if this Job's underlying K8s Job is
          # deleted out of band, provider-kubernetes does NOT self-heal it
          # until its next poll cycle, unlike the GCP-backed resources
          # above, which the provider re-creates immediately. A manual
          # reconcile-nudge on this Object is needed to force it sooner.
          - name: pgvector-migration
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                      name: pgvector-migration
                    spec:
                      backoffLimit: 6
                      template:
                        spec:
                          restartPolicy: Never
                          serviceAccountName: u-workload
                          containers:
                            - name: pgvector-migration
                              image: postgres:18-alpine
                              resources:
                                requests: {cpu: 100m, memory: 128Mi}
                              command: ["/bin/sh", "-c"]
                              args:
                                - |
                                  set -e
                                  apk add --no-cache curl jq >/dev/null
                                  for i in $(seq 1 10); do
                                    if TOKEN=$(curl -sf -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" | jq -r .access_token) \
                                      && curl -sf -H "Authorization: Bearer $TOKEN" "https://sqladmin.googleapis.com/sql/v1beta4/projects/$GCP_PROJECT/instances/$GCP_INSTANCE" -o /tmp/describe.json \
                                      && IP=$(jq -r '.settings.ipConfiguration.pscConfig.pscAutoConnections[0].ipAddress' /tmp/describe.json) \
                                      && curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"$DB_USER\",\"type\":\"CLOUD_IAM_SERVICE_ACCOUNT\",\"databaseRoles\":[\"cloudsqlsuperuser\"]}" "https://sqladmin.googleapis.com/sql/v1beta4/projects/$GCP_PROJECT/instances/$GCP_INSTANCE/users" >/dev/null; then
                                      sleep 5
                                      if PGPASSWORD="$TOKEN" psql "host=$IP port=5432 sslmode=require dbname=postgres user=$DB_USER" -c "CREATE EXTENSION IF NOT EXISTS vector;"; then
                                        exit 0
                                      fi
                                    fi
                                    echo "attempt $i not ready yet, retrying in 15s"
                                    sleep 15
                                  done
                                  echo "gave up after 10 attempts (150s)"
                                  exit 1
                              env:
                                - {name: GCP_PROJECT, value: PLACEHOLDER}
                                - {name: GCP_INSTANCE, value: PLACEHOLDER}
                                - {name: DB_USER, value: PLACEHOLDER}
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-pgvector-migration"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].value
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[1].value
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-db"}
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantName
                    - fromFieldPath: spec.tenantName
                  strategy: string
                  string: {fmt: "t0-u-%s-sa@t0-u-%s.iam"}
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[2].value

          # Per-tenant Redis, sized by tier.
          - name: redis
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: redis
                    spec:
                      replicas: 1
                      selector:
                        matchLabels: {app: redis}
                      template:
                        metadata:
                          labels: {app: redis}
                        spec:
                          containers:
                            - name: redis
                              image: redis:7-alpine
                              ports: [{containerPort: 6379}]
                              resources:
                                requests: {cpu: 100m}
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-redis"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sizeTier
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].resources.limits.memory
                transforms:
                  - type: match
                    match:
                      patterns:
                        - {type: literal, literal: small, result: 256Mi}
                        - {type: literal, literal: medium, result: 512Mi}
                        - {type: literal, literal: large, result: 1Gi}
                      fallbackTo: Value
                      fallbackValue: 256Mi

          # Per-tenant API key, real Secret Manager value via External
          # Secrets Operator (ESO). SecretStore authenticates to the
          # tenant's own GCP project via the tenant SA's existing Workload
          # Identity binding (u-workload KSA, same one used elsewhere in
          # this Composition) - no new identity. Password generator
          # referenced via dataFrom.sourceRef.generatorRef re-generates a
          # BRAND NEW value on every single reconcile (confirmed live - no
          # GeneratorState gets created for this usage pattern, despite that
          # CRD existing). ExternalSecret's refreshPolicy: CreatedOnce is
          # what actually makes the value stable: create once, never touch
          # again, ignoring ESO's default 1h refresh entirely. Without that
          # field this whole design silently rotates the tenant's API key
          # on every ESO resync. ExternalSecret materializes the one-time
          # value into the K8s Secret tenant-api-key. PushSecret reads that
          # SAME K8s Secret (not the generator directly - a
          # second generator reference would produce a different value)
          # and writes it into Secret Manager.
          - name: api-key-secretstore
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: SecretStore
                    metadata:
                      name: tenant-api-key-store
                    spec:
                      provider:
                        gcpsm:
                          auth:
                            workloadIdentity:
                              serviceAccountRef:
                                name: u-workload
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-key-store"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.spec.provider.gcpsm.projectID
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s"}

          - name: api-key-password
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: generators.external-secrets.io/v1alpha1
                    kind: Password
                    metadata:
                      name: tenant-api-key-password
                    spec:
                      length: 32
                      digits: 8
                      symbols: 0
                      noUpper: false
                      allowRepeat: true
                      secretKeys: ["api-key"]
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-key-password"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}

          - name: api-key-external-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      name: tenant-api-key
                    spec:
                      refreshPolicy: CreatedOnce
                      target:
                        name: tenant-api-key
                      dataFrom:
                        - sourceRef:
                            generatorRef:
                              apiVersion: generators.external-secrets.io/v1alpha1
                              kind: Password
                              name: tenant-api-key-password
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-key-external-secret"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}

          - name: api-key-push-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1alpha1
                    kind: PushSecret
                    metadata:
                      name: tenant-api-key-push
                    spec:
                      secretStoreRefs:
                        - name: tenant-api-key-store
                          kind: SecretStore
                      selector:
                        secret:
                          name: tenant-api-key
                      data:
                        - match:
                            secretKey: api-key
                            remoteRef:
                              remoteKey: tenant-api-key
                providerConfigRef:
                  name: default
                managementPolicies: ["*"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-api-key-push-secret"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: {type: Format, fmt: "u-%s"}
