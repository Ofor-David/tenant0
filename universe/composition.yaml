# Tenant stamp-out recipe: thin orchestrator composing 5 nested sub-XRs
# (each its own XRD/Composition pair, one per domain - see
# tenant-project/, tenant-database/, tenant-network/, tenant-workloads/,
# tenant-secrets/). Split out from one ~1240-line monolithic pipeline once
# it got too big to navigate; each sub-XR now owns its own resources and can
# be reasoned about independently. Only real cross-sub-XR data dependency:
# projectNumber (not derivable from tenantName, must flow from GCP at
# creation time) - relayed TenantProject.status -> this XR's own status ->
# TenantDatabase.spec, same round-trip pattern the monolith already used
# for kms-key-cloudsql-iam.
#
# sizeTier tiers: small=db-custom-1-3840/256Mi redis/quota 2cpu-2Gi,
# medium=db-custom-2-7680/512Mi/4cpu-4Gi, large=db-custom-4-15360/1Gi/8cpu-8Gi.
# Only small is exercised by tenant-a/tenant-b.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenants.universe.tenant0.io
spec:
  compositeTypeRef:
    apiVersion: universe.tenant0.io/v1alpha1
    kind: Tenant
  mode: Pipeline
  pipeline:
    - step: compose-tenant-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: tenant-project
            base:
              apiVersion: universe.tenant0.io/v1alpha1
              kind: TenantProject
              spec: {}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-project"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.tenantName
              - type: ToCompositeFieldPath
                fromFieldPath: status.projectId
                toFieldPath: status.projectId
              - type: ToCompositeFieldPath
                fromFieldPath: status.projectNumber
                toFieldPath: status.projectNumber

          - name: tenant-database
            base:
              apiVersion: universe.tenant0.io/v1alpha1
              kind: TenantDatabase
              spec: {}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-database"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.tenantName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sizeTier
                toFieldPath: spec.sizeTier
              - type: FromCompositeFieldPath
                fromFieldPath: status.projectNumber
                toFieldPath: spec.projectNumber
              - type: ToCompositeFieldPath
                fromFieldPath: status.cloudSqlConnectionName
                toFieldPath: status.cloudSqlConnectionName
              - type: ToCompositeFieldPath
                fromFieldPath: status.cloudSqlPscIpAddress
                toFieldPath: status.cloudSqlPscIpAddress
              - type: ToCompositeFieldPath
                fromFieldPath: status.cloudSqlPscDnsName
                toFieldPath: status.cloudSqlPscDnsName

          - name: tenant-network
            base:
              apiVersion: universe.tenant0.io/v1alpha1
              kind: TenantNetwork
              spec: {}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-network"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.tenantName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sizeTier
                toFieldPath: spec.sizeTier

          - name: tenant-workloads
            base:
              apiVersion: universe.tenant0.io/v1alpha1
              kind: TenantWorkloads
              spec: {}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-workloads"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.tenantName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sizeTier
                toFieldPath: spec.sizeTier
              - type: FromCompositeFieldPath
                fromFieldPath: status.cloudSqlConnectionName
                toFieldPath: spec.cloudSqlConnectionName

          - name: tenant-secrets
            base:
              apiVersion: universe.tenant0.io/v1alpha1
              kind: TenantSecrets
              spec: {}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: {type: Format, fmt: "t0-u-%s-secrets"}
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantName
                toFieldPath: spec.tenantName
