# TenantDatabase schema — Cloud SQL + CMEK for one tenant.
# Composed by the top-level Tenant Composition (../composition.yaml), never
# created directly by an operator (see universe-engine/admission-policy.yaml,
# which gates this the same way it gates Tenant itself).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: tenantdatabases.universe.tenant0.io
spec:
  group: universe.tenant0.io
  names:
    kind: TenantDatabase
    plural: tenantdatabases
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                tenantName:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
                sizeTier:
                  type: string
                  enum: [small, medium, large]
                # Relayed from TenantProject's status via the parent Tenant
                # XR's own status - not derivable from tenantName alone.
                projectNumber:
                  type: string
              required:
                - tenantName
                - sizeTier
                - projectNumber
            status:
              type: object
              properties:
                cloudSqlConnectionName:
                  type: string
                cloudSqlPscIpAddress:
                  type: string
          required:
            - spec
