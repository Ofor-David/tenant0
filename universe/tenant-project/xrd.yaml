# TenantProject schema — GCP project + identity foundation for one tenant.
# Composed by the top-level Tenant Composition (../composition.yaml), never
# created directly by an operator (see universe-engine/admission-policy.yaml,
# which gates this the same way it gates Tenant itself).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: tenantprojects.universe.tenant0.io
spec:
  group: universe.tenant0.io
  names:
    kind: TenantProject
    plural: tenantprojects
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                tenantName:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
              required:
                - tenantName
            status:
              type: object
              properties:
                projectId:
                  type: string
                projectNumber:
                  type: string
          required:
            - spec
